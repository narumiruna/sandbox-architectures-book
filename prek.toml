[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "mixed-line-ending" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"
hooks = [{ id = "zizmor" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-docs-coverage"
name = "Check Markdown page coverage in zensical.toml"
entry = "uv run --locked python scripts/check_docs_coverage.py"
language = "system"
always_run = true
pass_filenames = false
